<!DOCTYPE html>
<html lang="en">
<head style="display: flex; flex-direction: column;">
    <meta charset="UTF-8">
    <title>Registration Page</title>

    <style>
        body {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            gap: 20px;
            background: linear-gradient(135deg,#1d2671,#c33764);
        }

        .Header{
            font-weight: bold;
            font-size: 300%;
        }

        .register-box select {
            width: 100%;
            padding: 8px;
            margin: 8px 0;
        }

        .register-box {
            background: rgb(140, 71, 205);
            padding: 30px;
            width: 350px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        .register-box h2 {
            text-align: center;
        }

        .register-box input {
            width: 100%;
            padding: 8px;
            margin: 8px 0;
            gap: 5px;
        }

        .reg {
            width: 100%;
            padding: 10px;
            background: #2196F3;
            color: white;
            border-radius: 30px;
            cursor: pointer;
        }

        .register-box p {
            text-align: center;
        }

        
    </style>
</head>
<body>
    <div class="Header"> WELCOME TO BEST ENGINEERING COLLEGE</div>

    <div class="register-box">
        <h2>Register</h2>
        <form>
            <label>NAME</label>
            <input type="text" placeholder="Full Name" required>

            <label>E-Mail ID</label>
            <input type="email" placeholder="Email" required>

            <label>Phone Number</label>
            <input type="text" placeholder="Phone Number" required>

            <label>College Name</label>
            <input type="text" placeholder="College Name" required>

            <div>
                <label>Select Event</label>
                <select required>
                    <option value="">Choose th Event</option>
                    <option>technical Event</option>
                    <option>Non-Technical Event</option>
                </select>
            </div>
            <button type="submit" style="gap: 10px;">G-Pay</button>
            <button type="submit" class="reg">Register</button>
        </form>
    </div>

</body>
</html>
