<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Page</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1d2671, #c33764);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            font-family: Arial, sans-serif;
        }

        .Header {
            font-weight: bold;
            font-size: 2rem;
            color: white;
            text-align: center;
        }

        .register-box {
            background: white;
            padding: 30px;
            width: 400px;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.3);
        }

        .register-box h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        .register-box label {
            font-weight: bold;
        }

        .register-box input,
        .register-box select {
            width: 100%;
            padding: 10px;
            margin: 8px 0 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .btn-container {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .btn-container button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 30px;
            color: white;
            cursor: pointer;
            font-size: 15px;
        }

        .gpay {
            background: #34a853;
        }

        .reg {
            background: #2196F3;
        }

        .btn-container button:hover {
            opacity: 0.9;
        }
    </style>
</head>

<body>

    <div class="Header">
        WELCOME TO BEST ENGINEERING COLLEGE
    </div>

    <div class="register-box">
        <h2>Register</h2>

        <form id="registerForm">
            <label>NAME</label>
            <input type="text" name="name" placeholder="Full Name" required>

            <label>E-Mail ID</label>
            <input type="email" name="email" placeholder="Email" required>

            <label>Phone Number</label>
            <input type="tel" name="phone" placeholder="Phone Number" required>

            <label>College Name</label>
            <input type="text" name="college" placeholder="College Name" required>

            <label>Select Event</label>
            <select name="event" required>
                <option value="">Choose the Event</option>
                <option value="Technical Event">Technical Event</option>
                <option value="Non-Technical Event">Non-Technical Event</option>
            </select>

            <div class="btn-container">
                <button type="button" class="gpay">G-Pay</button>
                <button type="submit" class="reg">Register</button>
            </div>
        </form>
    </div>

    <script>
        const form = document.getElementById("registerForm");

        form.addEventListener("submit", async (e) => {

            e.preventDefault();

            const formData = new FormData(form);

            const data = {
                name: formData.get("name"),
                email: formData.get("email"),
                phone: formData.get("phone"),
                college: formData.get("college"),
                event: formData.get("event")
            };

            try {
                const response = await fetch("/register", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.text();
                alert(result);

            } catch (err) {
                console.log(err);
                alert("Something went wrong");
            }
        });
    </script>

</body>
</html>
